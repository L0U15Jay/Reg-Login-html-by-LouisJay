<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云登录 · 简易注册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f44 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      transition: all 0.3s ease;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 3rem;
      padding: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab-btn {
      flex: 1;
      padding: 0.85rem 0.5rem;
      border: none;
      background: transparent;
      color: #a0b8d0;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 2.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #0b1a2e;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.6);
    }

    .tab-btn:not(.active):hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e0edff;
    }

    .form-panel {
      display: none;
      flex-direction: column;
      gap: 1.1rem;
    }

    .form-panel.active {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #b0c8e0;
      margin-left: 0.5rem;
    }

    .input-group input {
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      padding: 0.95rem 1.25rem;
      font-size: 1rem;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .input-group input::placeholder {
      color: #6e8aa8;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .input-group input:focus {
      border-color: #4f9cf7;
      background: rgba(10, 30, 50, 0.8);
      box-shadow: 0 0 0 4px rgba(79, 156, 247, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f9cf7, #2d6fdb);
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 2rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 12px 20px -12px #0b1a2e, 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      margin-top: 0.25rem;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #62abff, #3c7eec);
      transform: scale(1.01);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      min-height: 2rem;
      font-size: 0.9rem;
      padding: 0.5rem 0.9rem;
      border-radius: 1.2rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 0.1rem;
      line-height: 1.4;
      transition: all 0.2s;
      word-break: break-word;
    }

    .message.error {
      color: #ffb0b0;
      background: rgba(220, 38, 38, 0.18);
      border-left: 4px solid #f87171;
    }

    .message.success {
      color: #b0f0c0;
      background: rgba(34, 197, 94, 0.15);
      border-left: 4px solid #4ade80;
    }

    .message.warning {
      color: #ffd8a0;
      background: rgba(245, 158, 11, 0.15);
      border-left: 4px solid #f59e0b;
    }

    .extra-hint {
      text-align: center;
      font-size: 0.85rem;
      color: #7f9ab8;
      margin-top: 0.4rem;
    }

    .extra-hint span {
      color: #6fb3ff;
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .extra-hint span:hover {
      color: #a0d0ff;
    }

    .welcome-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.25rem;
      padding: 0.5rem 0;
    }

    .welcome-panel.active {
      display: flex;
    }

    .welcome-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f9cf7, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 30px -10px rgba(79, 156, 247, 0.6);
      text-transform: uppercase;
    }

    .welcome-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
    }

    .welcome-sub {
      font-size: 0.9rem;
      color: #8fa8c4;
      line-height: 1.6;
      word-break: break-all;
    }

    .welcome-sub strong {
      color: #bcd8ff;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffb0b0;
      padding: 0.85rem 1.75rem;
      border-radius: 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      margin-top: 0.5rem;
    }

    .btn-logout:hover {
      background: rgba(220, 38, 38, 0.2);
      border-color: rgba(248, 113, 113, 0.5);
    }

    /* 注销账号按钮 */
    .btn-delete {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #ff8a8a;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      margin-top: 0.3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 160px;
    }
    .btn-delete:hover:not(:disabled) {
      background: rgba(220, 38, 38, 0.3);
      border-color: rgba(248, 113, 113, 0.7);
      color: #ffb0b0;
    }
    .btn-delete:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 自定义确认弹窗 */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1.5rem;
    }
    .confirm-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .confirm-box {
      background: #1a2b3f;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .confirm-overlay.show .confirm-box {
      transform: scale(1);
    }
    .confirm-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.8rem;
    }
    .confirm-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ff8a8a;
      margin-bottom: 0.75rem;
    }
    .confirm-desc {
      text-align: center;
      font-size: 0.9rem;
      color: #a0b8d0;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .confirm-actions {
      display: flex;
      gap: 0.75rem;
    }
    .confirm-actions button {
      flex: 1;
      padding: 0.85rem;
      border-radius: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      border: none;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #c0d4e8;
    }
    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 8px 16px -8px rgba(220, 38, 38, 0.6);
    }
    .btn-danger:hover:not(:disabled) {
      background: linear-gradient(135deg, #f87171, #ef4444);
      transform: scale(1.02);
    }
    .btn-danger:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cloud-note {
      margin-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.2rem;
      font-size: 0.75rem;
      color: #5a7896;
      text-align: center;
      line-height: 1.6;
      letter-spacing: 0.2px;
    }

    .badge-cloud {
      display: inline-block;
      background: rgba(79, 156, 247, 0.2);
      border: 1px solid rgba(79, 156, 247, 0.3);
      color: #9ac8ff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border-radius: 3rem;
      margin-right: 0.4rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <!-- 登录/注册视图 -->
    <div id="authView">
      <div class="tabs">
        <button class="tab-btn active" id="tabLoginBtn" data-tab="login">登录</button>
        <button class="tab-btn" id="tabRegisterBtn" data-tab="register">注册</button>
      </div>

      <!-- 登录面板 -->
      <div class="form-panel active" id="loginPanel">
        <div class="input-group">
          <label for="loginEmail">邮箱</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="input-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="message" id="loginMessage"></div>
        <button class="btn-primary" id="loginBtn">登录</button>
        <div class="extra-hint">
          还没有账号？<span id="switchToRegister">立即注册</span>
        </div>
      </div>

      <!-- 注册面板 -->
      <div class="form-panel" id="registerPanel">
        <div class="input-group">
          <label for="registerUsername">用户名</label>
          <input type="text" id="registerUsername" placeholder="给自己起个名字（至少2位）" autocomplete="nickname">
        </div>
        <div class="input-group">
          <label for="registerEmail">邮箱</label>
          <input type="email" id="registerEmail" placeholder="you@example.com（仅作账号标识）" autocomplete="email">
        </div>
        <div class="input-group">
          <label for="registerPassword">密码</label>
          <input type="password" id="registerPassword" placeholder="至少6位" autocomplete="new-password">
        </div>
        <div class="input-group">
          <label for="registerConfirm">确认密码</label>
          <input type="password" id="registerConfirm" placeholder="再次输入密码" autocomplete="off">
        </div>
        <div class="message" id="registerMessage"></div>
        <button class="btn-primary" id="registerBtn">注册</button>
        <div class="extra-hint">
          已有账号？<span id="switchToLogin">返回登录</span>
        </div>
      </div>

      <div class="cloud-note">
        <span class="badge-cloud">☁️ Supabase 云端</span>
        账号数据加密存储在 Supabase，跨设备可用。<br>
        邮箱仅作账号标识，无需验证即可登录。
      </div>
    </div>

    <!-- 登录成功后 -->
    <div class="welcome-panel" id="welcomeView">
      <div class="welcome-avatar" id="welcomeAvatar">U</div>
      <div class="welcome-title" id="welcomeTitle">欢迎回来</div>
      <div class="welcome-sub">
        用户名：<strong id="welcomeUsername">—</strong><br>
        邮箱：<strong id="welcomeEmail">—</strong>
      </div>
      <button class="btn-logout" id="logoutBtn">退出登录</button>
      <button class="btn-delete" id="deleteAccountBtn">⚠️ 永久注销账号</button>
    </div>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-icon">⚠️</div>
      <div class="confirm-title">永久注销账号？</div>
      <div class="confirm-desc">
        此操作不可撤销。<br>
        你的邮箱将被释放，之后可以用同一邮箱重新注册。
      </div>
      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmCancel">取消</button>
        <button class="btn-danger" id="confirmDelete">确认永久删除</button>
      </div>
    </div>
  </div>

  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (function () {
      'use strict';

      const SUPABASE_URL = 'https://eweempozqecmbxtibypr.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_f2p71KCimQeuF2m_MOL34A_k71bT_WV';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      const authView = document.getElementById('authView');
      const welcomeView = document.getElementById('welcomeView');

      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');
      const loginPanel = document.getElementById('loginPanel');
      const registerPanel = document.getElementById('registerPanel');

      const loginEmail = document.getElementById('loginEmail');
      const loginPassword = document.getElementById('loginPassword');
      const loginBtn = document.getElementById('loginBtn');
      const loginMessage = document.getElementById('loginMessage');

      const registerUsername = document.getElementById('registerUsername');
      const registerEmail = document.getElementById('registerEmail');
      const registerPassword = document.getElementById('registerPassword');
      const registerConfirm = document.getElementById('registerConfirm');
      const registerBtn = document.getElementById('registerBtn');
      const registerMessage = document.getElementById('registerMessage');

      const switchToRegister = document.getElementById('switchToRegister');
      const switchToLogin = document.getElementById('switchToLogin');

      const welcomeAvatar = document.getElementById('welcomeAvatar');
      const welcomeTitle = document.getElementById('welcomeTitle');
      const welcomeUsername = document.getElementById('welcomeUsername');
      const welcomeEmail = document.getElementById('welcomeEmail');
      const logoutBtn = document.getElementById('logoutBtn');
      const deleteAccountBtn = document.getElementById('deleteAccountBtn');

      const confirmOverlay = document.getElementById('confirmOverlay');
      const confirmCancel = document.getElementById('confirmCancel');
      const confirmDelete = document.getElementById('confirmDelete');

      function setMessage(el, text, type = 'error') {
        el.textContent = text;
        el.className = 'message';
        if (text) el.classList.add(type);
      }

      function clearMessage(el) {
        el.textContent = '';
        el.className = 'message';
      }

      function setLoading(btn, isLoading, loadingText) {
        if (isLoading) {
          btn.dataset.originalText = btn.innerHTML;
          btn.innerHTML = '<span class="spinner"></span>' + loadingText;
          btn.disabled = true;
        } else {
          if (btn.dataset.originalText) {
            btn.innerHTML = btn.dataset.originalText;
          }
          btn.disabled = false;
        }
      }

      function isValidEmail(email) {
        return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,24}$/.test(email);
      }

      function translateAuthError(message) {
        if (!message) return '操作失败，请重试';
        const msg = message.toLowerCase();

        if (msg.includes('invalid login credentials')) return '❌ 邮箱或密码错误';
        if (msg.includes('user already registered')) return '❌ 该邮箱已被注册';
        if (msg.includes('email not confirmed')) return '⚠️ 邮箱未验证，请检查邮箱';
        if (msg.includes('password should be at least')) return '⚠️ 密码长度至少 6 位';
        if (msg.includes('unable to validate email')) return '⚠️ 邮箱格式不正确';
        if (msg.includes('email address') && msg.includes('invalid')) return '⚠️ 邮箱格式不正确';
        if (msg.includes('rate limit') || msg.includes('too many requests') || msg.includes('after')) {
          return '⚠️ 操作太频繁，请稍后再试';
        }
        if (msg.includes('network')) return '⚠️ 网络异常，请检查网络连接';
        if (msg.includes('user not found')) return '❌ 该邮箱未注册';

        return '❌ ' + message;
      }

      const cooldownState = {
        register: { until: 0, timer: null },
        login:    { until: 0, timer: null }
      };

      function startCooldown(key, seconds, btn, msgEl, label) {
        const state = cooldownState[key];
        if (state.timer) clearInterval(state.timer);
        state.until = Date.now() + seconds * 1000;

        const tick = () => {
          const remain = Math.ceil((state.until - Date.now()) / 1000);
          if (remain <= 0) {
            clearInterval(state.timer);
            state.timer = null;
            btn.disabled = false;
            btn.innerHTML = label;
            clearMessage(msgEl);
            return;
          }
          btn.disabled = true;
          btn.innerHTML = `⏳ 请等待 ${remain}s`;
        };

        tick();
        state.timer = setInterval(tick, 250);
      }

      function isCoolingDown(key) {
        return Date.now() < cooldownState[key].until;
      }

      function switchTab(tab) {
        clearMessage(loginMessage);
        clearMessage(registerMessage);

        if (tab === 'login') {
          tabLoginBtn.classList.add('active');
          tabRegisterBtn.classList.remove('active');
          loginPanel.classList.add('active');
          registerPanel.classList.remove('active');
        } else {
          tabRegisterBtn.classList.add('active');
          tabLoginBtn.classList.remove('active');
          registerPanel.classList.add('active');
          loginPanel.classList.remove('active');
        }
      }

      tabLoginBtn.addEventListener('click', () => switchTab('login'));
      tabRegisterBtn.addEventListener('click', () => switchTab('register'));
      switchToRegister.addEventListener('click', () => switchTab('register'));
      switchToLogin.addEventListener('click', () => switchTab('login'));

      [loginEmail, loginPassword].forEach(el =>
        el.addEventListener('input', () => clearMessage(loginMessage))
      );
      [registerUsername, registerEmail, registerPassword, registerConfirm].forEach(el =>
        el.addEventListener('input', () => clearMessage(registerMessage))
      );

      async function handleRegister() {
        if (isCoolingDown('register')) {
          setMessage(registerMessage, '⚠️ 操作太频繁，请等待冷却结束', 'warning');
          return;
        }

        const username = registerUsername.value.trim();
        const email = registerEmail.value.trim();
        const password = registerPassword.value;
        const confirm = registerConfirm.value;

        if (!username) return setMessage(registerMessage, '⚠️ 请输入用户名', 'error');
        if (username.length < 2) return setMessage(registerMessage, '⚠️ 用户名至少 2 位', 'error');
        if (!email) return setMessage(registerMessage, '⚠️ 请输入邮箱', 'error');
        if (!isValidEmail(email)) return setMessage(registerMessage, '⚠️ 邮箱格式不正确，请检查', 'error');
        if (!password) return setMessage(registerMessage, '⚠️ 请输入密码', 'error');
        if (password.length < 6) return setMessage(registerMessage, '⚠️ 密码至少 6 位', 'error');
        if (password !== confirm) return setMessage(registerMessage, '⚠️ 两次输入的密码不一致', 'error');

        setLoading(registerBtn, true, '注册中…');
        clearMessage(registerMessage);

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: { username: username }
            }
          });

          if (error) {
            const msg = error.message || '';
            if (msg.toLowerCase().includes('after') ||
                msg.toLowerCase().includes('rate limit') ||
                msg.toLowerCase().includes('too many requests')) {
              const match = msg.match(/after (\d+)/i);
              const waitSeconds = match ? parseInt(match[1], 10) : 60;
              setMessage(registerMessage,
                `⚠️ 操作太频繁，需要等待 ${waitSeconds} 秒`,
                'warning');
              startCooldown('register', waitSeconds, registerBtn, registerMessage, '注册');
              return;
            }
            setMessage(registerMessage, translateAuthError(msg), 'error');
            return;
          }

          if (data.session) {
            setMessage(registerMessage, '✅ 注册成功，正在进入…', 'success');
            setTimeout(() => showWelcome(data.user), 600);
          } else if (data.user && !data.session) {
            setMessage(registerMessage, '✅ 注册成功，请登录', 'success');
            setTimeout(() => {
              switchTab('login');
              loginEmail.value = email;
              loginPassword.value = '';
              loginPassword.focus();
              registerUsername.value = '';
              registerEmail.value = '';
              registerPassword.value = '';
              registerConfirm.value = '';
            }, 800);
          } else {
            setMessage(registerMessage, '✅ 注册成功，请登录', 'success');
          }
        } catch (err) {
          console.error('注册异常:', err);
          setMessage(registerMessage, '❌ 注册失败，请稍后再试', 'error');
        } finally {
          if (!isCoolingDown('register')) {
            setLoading(registerBtn, false);
          }
        }
      }

      registerBtn.addEventListener('click', handleRegister);
      registerConfirm.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); handleRegister(); }
      });
      registerUsername.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); registerEmail.focus(); }
      });
      registerEmail.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); registerPassword.focus(); }
      });
      registerPassword.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); registerConfirm.focus(); }
      });

      async function handleLogin() {
        if (isCoolingDown('login')) {
          setMessage(loginMessage, '⚠️ 操作太频繁，请等待冷却结束', 'warning');
          return;
        }

        const email = loginEmail.value.trim();
        const password = loginPassword.value;

        if (!email) return setMessage(loginMessage, '⚠️ 请输入邮箱', 'error');
        if (!isValidEmail(email)) return setMessage(loginMessage, '⚠️ 邮箱格式不正确，请检查', 'error');
        if (!password) return setMessage(loginMessage, '⚠️ 请输入密码', 'error');

        setLoading(loginBtn, true, '登录中…');
        clearMessage(loginMessage);

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) {
            const msg = error.message || '';
            if (msg.toLowerCase().includes('after') ||
                msg.toLowerCase().includes('rate limit') ||
                msg.toLowerCase().includes('too many requests')) {
              const match = msg.match(/after (\d+)/i);
              const waitSeconds = match ? parseInt(match[1], 10) : 60;
              setMessage(loginMessage,
                `⚠️ 操作太频繁，需要等待 ${waitSeconds} 秒`,
                'warning');
              startCooldown('login', waitSeconds, loginBtn, loginMessage, '登录');
              return;
            }
            setMessage(loginMessage, translateAuthError(msg), 'error');
            return;
          }

          setMessage(loginMessage, '✅ 登录成功，正在进入…', 'success');
          setTimeout(() => showWelcome(data.user), 600);
        } catch (err) {
          console.error('登录异常:', err);
          setMessage(loginMessage, '❌ 登录失败，请稍后再试', 'error');
        } finally {
          if (!isCoolingDown('login')) {
            setLoading(loginBtn, false);
          }
        }
      }

      loginBtn.addEventListener('click', handleLogin);
      loginPassword.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
      });
      loginEmail.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); loginPassword.focus(); }
      });

      function showWelcome(user) {
        if (!user) return;

        const username = (user.user_metadata && user.user_metadata.username) || '用户';
        const email = user.email || '—';
        const initial = username.trim().charAt(0).toUpperCase() || 'U';

        welcomeAvatar.textContent = initial;
        welcomeTitle.textContent = '欢迎回来，' + username;
        welcomeUsername.textContent = username;
        welcomeEmail.textContent = email;

        authView.style.display = 'none';
        welcomeView.classList.add('active');

        loginEmail.value = '';
        loginPassword.value = '';
        clearMessage(loginMessage);
        clearMessage(registerMessage);
      }

      function hideWelcome() {
        welcomeView.classList.remove('active');
        authView.style.display = 'block';
        switchTab('login');
      }

      async function handleLogout() {
        setLoading(logoutBtn, true, '退出中…');
        try {
          await supabaseClient.auth.signOut();
        } catch (err) {
          console.error('登出异常:', err);
        } finally {
          setLoading(logoutBtn, false);
          hideWelcome();
        }
      }

      logoutBtn.addEventListener('click', handleLogout);

      function openConfirmDialog() {
        confirmOverlay.classList.add('show');
      }

      function closeConfirmDialog() {
        confirmOverlay.classList.remove('show');
      }

      confirmCancel.addEventListener('click', closeConfirmDialog);
      confirmOverlay.addEventListener('click', (e) => {
        if (e.target === confirmOverlay) closeConfirmDialog();
      });

      async function doDeleteAccount() {
        confirmDelete.disabled = true;
        confirmDelete.textContent = '删除中…';
        confirmCancel.disabled = true;

        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (!session) {
            alert('会话已过期，请重新登录');
            closeConfirmDialog();
            hideWelcome();
            return;
          }

          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/delete-user`,
            {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${session.access_token}`,
                'apikey': SUPABASE_PUBLISHABLE_KEY,
                'Content-Type': 'application/json'
              }
            }
          );

          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            console.error('删除失败:', result);
            alert('删除失败：' + (result.error || `HTTP ${response.status}`));
            return;
          }

          closeConfirmDialog();
          await supabaseClient.auth.signOut();
          hideWelcome();

          setTimeout(() => {
            alert('✅ 账号已永久删除\n\n你的邮箱现在可以重新注册了。');
          }, 200);
        } catch (err) {
          console.error('注销异常:', err);
          alert('注销失败，请稍后再试');
        } finally {
          confirmDelete.disabled = false;
          confirmDelete.textContent = '确认永久删除';
          confirmCancel.disabled = false;
        }
      }

      confirmDelete.addEventListener('click', doDeleteAccount);
      deleteAccountBtn.addEventListener('click', openConfirmDialog);

      (async function checkSession() {
        try {
          const { data, error } = await supabaseClient.auth.getSession();
          if (error) {
            console.warn('获取会话失败:', error.message);
            return;
          }
          if (data && data.session && data.session.user) {
            showWelcome(data.session.user);
          }
        } catch (err) {
          console.error('检查会话异常:', err);
        }
      })();

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') {
          hideWelcome();
        } else if (event === 'SIGNED_IN' && session && session.user) {
          showWelcome(session.user);
        }
      });

    })();
  </script>
</body>
</html>
